[project]
name = "llm-devtools"
version = "0.1.0"
description = "LLM eval and dev tools: promptbench, rag-bench, git-why"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "respx>=0.21"]
rag = ["chromadb>=0.5", "sentence-transformers>=3.0", "rank-bm25>=0.2"]
demo = ["gradio>=4.40"]

[project.scripts]
git-why = "git_why.cli:app"
promptbench = "promptbench.cli:app"
rag-bench = "rag_bench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "git_why", "rag_bench", "promptbench"]

[tool.setuptools.package-dir]
promptbench = "promptbench/promptbench"
